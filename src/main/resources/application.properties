# ──────────────────────────────────────────────
# AgroPulse Backend – Application Configuration
# ──────────────────────────────────────────────

server.port=${PORT:8080}

# ── OpenWeatherMap API ────────────────────────
# 👉 Replace with your real API key from:
#    https://openweathermap.org/api  (free tier works)
weather.api.key=cc26878a76ee5f8a3caac61a955520ea
weather.api.url=https://api.openweathermap.org/data/2.5/weather

# ── SQLite Database ───────────────────────────
spring.datasource.url=jdbc:sqlite:agripulse.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── File Upload ───────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS (allow frontend on any port) ─────────
cors.allowed-origins=*

# ── Logging ───────────────────────────────────
logging.level.com.agripulse=INFO
